<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHOUSE Special Creator</title>
<link rel="stylesheet" href="hero-home.css">
</head>
<body>

  <section class="hero-pin">
    <div class="hero-pin__stage" id="heroStage">

      <!-- logo revealed through the keyhole, sharpens as you scroll -->
      <div class="hero-pin__logo" id="heroLogo">
        <img class="hero-pin__logo-ohouse" src="assets/logo-ohouse.svg" alt="OHOUSE">
        <img class="hero-pin__logo-special" src="assets/logo-special-creator.svg" alt="SPECIAL CREATOR">
      </div>

      <!-- dark keyhole overlay, scales up + blurs away as you scroll -->
      <div class="hero-pin__overlay" id="heroOverlay">
        <svg class="hero-pin__overlay-img" id="keyholeSvg" viewBox="0 0 1280 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" fill="url(#keyholeGradient)" d="M1280 1080H0V0H1280V1080ZM640.599 374C596.085 374 560 410.085 560 454.599C560 483.666 575.388 509.139 598.462 523.317L560.008 656.388C560.013 656.423 567.035 705.739 640.599 705.739C712.388 705.739 721.178 656.455 721.189 656.388L682.734 523.317C705.808 509.139 721.197 483.667 721.197 454.599C721.197 410.085 685.112 374 640.599 374Z"/>
          <defs>
            <linearGradient id="keyholeGradient" x1="74.5" y1="1080" x2="1021" y2="404" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2F2C2C"/>
              <stop offset="1" stop-color="#181415"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- scroll hint flanking the keyhole -->
      <div class="hero-pin__hint" id="heroHint">
        <span class="hero-pin__hint-word hero-pin__hint-word--left" id="heroHintScroll">Scroll</span>
        <span class="hero-pin__hint-word hero-pin__hint-word--right" id="heroHintDown">Down</span>
      </div>

      <!-- appears once the logo settles: nudges the user to keep scrolling -->
      <div class="hero-pin__down-hint" id="heroDownHint">
        <img src="assets/downscroll-icon.svg" alt="아래로 스크롤">
      </div>

    </div>
  </section>

  <section class="next-section">
    <h2>영감을 여는 사람들, Key Creator</h2>
    <p>자신만의 시선으로 집과 일상의 새로운 가능성을 여는<br>오늘의집 스페셜 크리에이터를 소개합니다.</p>

    <a href="FindTheKey.html" class="key-link" id="keyLink" aria-label="Find the Key로 이동">
      <div class="key-visual">
        <!-- shadow: stays put, no floating motion -->
        <div class="key-shadow">
          <div class="key-shadow__glow key-shadow__glow--main">
            <img src="assets/key-shadow-1.svg" alt="">
          </div>
          <div class="key-shadow__glow key-shadow__glow--accent">
            <img src="assets/key-shadow-2.svg" alt="">
          </div>
        </div>
        <!-- photo: this is the only part that bobs -->
        <div class="key-photo-wrap">
          <img class="key-photo" src="assets/key-photo.png" alt="Key">
        </div>
      </div>
    </a>
  </section>

  <!-- custom "Click me" cursor, follows the pointer while hovering the key -->
  <div class="cursor-badge" id="cursorBadge">Click me</div>

  <script src="hero-home.js"></script>
</body>
</html>
